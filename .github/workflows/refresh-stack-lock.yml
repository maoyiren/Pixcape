name: Refresh stack upgrade lockfiles

on:
  push:
    branches:
      - chore/stack-refresh-nov-2026
    paths:
      - package.json
      - ai-api/package.json
      - .github/workflows/refresh-stack-lock.yml
  pull_request:
    branches: [main]
    paths:
      - package.json
      - ai-api/package.json
      - .github/workflows/refresh-stack-lock.yml
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to refresh
        required: true
        default: chore/stack-refresh-nov-2026

permissions:
  contents: write

concurrency:
  group: refresh-stack-lock-${{ github.event.inputs.branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.event.inputs.branch || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          check-latest: true
          cache: npm
      - name: Regenerate root lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Regenerate AI API lockfile
        run: npm --prefix ai-api install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lockfiles
        run: |
          if git diff --quiet -- package-lock.json ai-api/package-lock.json; then
            echo "Lockfiles already match the declared stable versions."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json ai-api/package-lock.json
          git commit -m "chore(deps): regenerate npm lockfiles"
          git push origin HEAD
