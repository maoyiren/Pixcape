name: Next.js Preview Build and Security Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'public/**'
      - 'pages/**'
      - 'scripts/**'
      - 'auth.ts'
      - 'lib/**'
      - 'prisma/**'
      - 'prisma.config.ts'
      - 'Dockerfile.nextjs'
      - 'tests/**'
      - 'next.config.ts'
      - 'tsconfig.next.json'
      - 'tsconfig.json'
      - 'package-lock.json'
      - 'package.json'
      - '.env.example'
      - 'docs/NEXTJS-USER-ROLES-MIGRATION.md'
      - 'docs/PRODUCTION-SECURITY-ROLLOUT.md'
      - 'docs/NEXTJS-CONTAINER-DEPLOYMENT.md'
      - '.github/workflows/next-preview.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-postgres-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: pixcape
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d pixcape"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/pixcape?schema=public
      NEXTAUTH_SECRET: ci-only-secret-not-for-production
      NEXTAUTH_URL: http://127.0.0.1:3000
      LOGIN_RATE_LIMIT_MAX: '10'
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: '900'
      ASSET_STORAGE_DIR: /tmp/pixcape-e2e-assets
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          check-latest: true
      - name: Install dependencies
        run: npm ci
      - name: Report high and critical dependency advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node <<'NODE'
          const audit = require('/tmp/npm-audit.json')
          console.log('Dependency audit summary:', audit.metadata?.vulnerabilities)
          for (const [name, issue] of Object.entries(audit.vulnerabilities || {})) {
            if (['high', 'critical'].includes(issue.severity)) {
              console.log(JSON.stringify({
                name,
                severity: issue.severity,
                fixAvailable: issue.fixAvailable,
                via: issue.via.map(item => typeof item === 'string' ? item : item.title),
              }))
            }
          }
          NODE
      - name: Fail on high or critical dependency advisories
        run: npm audit --audit-level=high
      - name: Generate and validate PostgreSQL Prisma Client
        run: npm run db:generate && npx prisma validate
      - name: Apply PostgreSQL migrations
        run: npm run db:migrate
      - name: Run RBAC and ownership unit tests
        run: npm run test:unit
      - name: Run PostgreSQL integration tests
        run: npm run test:integration
      - name: Build Next.js production app
        run: npm run build
      - name: Build isolated Next.js runtime image (PostgreSQL)
        run: docker build --file Dockerfile.nextjs --tag pixcape-nextjs-preview .
      - name: Start Next.js for security E2E
        run: |
          nohup npm run next:start -- --port 3000 > /tmp/pixcape-next.log 2>&1 &
          echo $! > /tmp/pixcape-next.pid
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/pixcape-next.log
          exit 1
      - name: Run security end-to-end tests
        run: npm run test:e2e
      - name: Stop Next.js
        if: always()
        run: |
          if [ -f /tmp/pixcape-next.pid ]; then kill "$(cat /tmp/pixcape-next.pid)" || true; fi
          cat /tmp/pixcape-next.log || true
