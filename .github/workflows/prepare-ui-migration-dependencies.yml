name: Prepare UI migration dependencies

on:
  push:
    branches:
      - feat/cdpc-ui-library-migration

permissions:
  contents: write

concurrency:
  group: cdpc-ui-migration-dependencies
  cancel-in-progress: false

jobs:
  resolve-lockfile:
    if: "!contains(github.event.head_commit.message, 'chore(ui): resolve migration dependencies')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Add UI libraries and regenerate the root lockfile
        run: |
          npm install --save @mantine/core @mantine/hooks
          npm install --save-dev tailwindcss @tailwindcss/vite @tailwindcss/postcss
      - name: Verify clean reproducible installation
        run: |
          rm -rf node_modules
          npm ci --no-audit --no-fund
      - name: Commit dependency manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency manifests are already up to date."
            exit 0
          fi
          git commit -m "chore(ui): resolve migration dependencies"
          git push origin HEAD:${{ github.ref_name }}
