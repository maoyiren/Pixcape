name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-v4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: pixcape
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d pixcape"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-ci
          MYSQL_DATABASE: pixcape
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uci -pci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
      - run: npm ci --no-audit --no-fund
      - name: Run unit tests
        run: npm run test:unit
      - name: Migrate PostgreSQL and run security integration tests
        env:
          DATABASE_PROVIDER: postgresql
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/pixcape?schema=public
        run: npm run db:generate:all && npm run db:migrate && npm run test:integration
      - name: Migrate MySQL and run rate-limit integration tests
        env:
          DATABASE_PROVIDER: mysql
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/pixcape
        run: npm run db:generate:all && npm run db:migrate && npm run test:mysql-rate-limit
      - name: Migrate SQLite and run rate-limit integration tests
        env:
          DATABASE_PROVIDER: sqlite
          DATABASE_URL: file:/tmp/pixcape-ci.db
        run: npm run db:generate:all && npm run db:migrate && npm run test:sqlite-rate-limit
      - name: Report high and critical dependency advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node <<'NODE'
          const audit = require('/tmp/npm-audit.json')
          console.log('Dependency audit summary:', audit.metadata?.vulnerabilities)
          for (const [name, issue] of Object.entries(audit.vulnerabilities || {})) {
            if (['high', 'critical'].includes(issue.severity)) {
              console.log(JSON.stringify({
                name,
                severity: issue.severity,
                fixAvailable: issue.fixAvailable,
                via: issue.via.map(item => typeof item === 'string' ? item : item.title),
              }))
            }
          }
          NODE
      - name: Fail on high or critical dependency advisories
        run: npm audit --audit-level=high
      - run: npm run build
      - name: Install Chromium for browser regression tests
        run: npx playwright install --with-deps chromium
      - name: Run browser regression tests
        env:
          NEXTAUTH_SECRET: cdpc-browser-test-secret-not-for-production-0123456789
          NEXTAUTH_URL: http://127.0.0.1:3000
          DATABASE_PROVIDER: sqlite
          DATABASE_URL: file:/tmp/cdpc-browser-test.db
        run: npm run test:browser
      - name: Install and test AI API
        run: npm --prefix ai-api ci && npm --prefix ai-api test
      - name: Build AI API container
        run: docker build --tag pixcape-ai-api-test ./ai-api
      - name: Build complete Pixcape image including Blockbench
        run: docker build --tag pixcape-integration-test .
