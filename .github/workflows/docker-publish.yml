name: Build and publish Docker image

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'Dockerfile.nextjs'
      - 'docker-entrypoint-single.sh'
      - 'docker-compose.yml'
      - '.env.example'
      - 'doc/**'
      - 'nginx.conf'
      - 'package.json'
      - 'package-lock.json'
      - 'prisma/**'
      - 'generated/**'
      - 'lib/**'
      - 'app/**'
      - 'auth.ts'
      - 'next.config.ts'
      - 'tsconfig*.json'
      - 'ai-api/**'
      - '.github/workflows/docker-publish.yml'
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-publish-postgres-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pixcape
          POSTGRES_PASSWORD: pixcape
          POSTGRES_DB: pixcape
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pixcape -d pixcape"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build PostgreSQL-only image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: pixcape:postgresql-smoke-test
          cache-from: type=gha,scope=runtime-postgresql
          cache-to: type=gha,mode=max,scope=runtime-postgresql
      - name: Start image against PostgreSQL and verify routes
        shell: bash
        run: |
          set -euo pipefail
          docker rm -f pixcape-smoke >/dev/null 2>&1 || true
          mkdir -p /tmp/pixcape-smoke-data
          cleanup() {
            docker logs pixcape-smoke || true
            docker rm -f pixcape-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name pixcape-smoke \
            --add-host=host.docker.internal:host-gateway \
            -p 127.0.0.1:18787:80 \
            -e DATABASE_URL='postgresql://pixcape:pixcape@host.docker.internal:5432/pixcape?schema=public' \
            -e NEXTAUTH_SECRET='ci-only-secret-not-for-production-0123456789' \
            -e NEXTAUTH_URL='http://localhost:18787' \
            -v /tmp/pixcape-smoke-data:/data \
            pixcape:postgresql-smoke-test >/dev/null
          for attempt in $(seq 1 60); do
            health_ok=0
            app_ok=0
            curl --fail --silent http://127.0.0.1:18787/health >/tmp/pixcape-health.json && health_ok=1 || true
            app_code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18787/ || true)"
            [ "$app_code" = "200" ] && app_ok=1 || true
            if [ "$health_ok" -eq 1 ] && [ "$app_ok" -eq 1 ]; then break; fi
            if [ "$attempt" -eq 60 ]; then
              echo "Container did not become ready (health=$health_ok app_http=$app_code)" >&2
              docker logs pixcape-smoke >&2 || true
              exit 1
            fi
            sleep 2
          done
          node -e "const fs=require('fs'); const h=JSON.parse(fs.readFileSync('/tmp/pixcape-health.json','utf8')); if(h.status!=='ok') process.exit(1)"
          check_http() {
            local path="$1"
            local expected="${2:-}"
            local code
            code="$(curl --location --silent --show-error --output /tmp/pixcape-response.txt --write-out '%{http_code}' "http://127.0.0.1:18787$path" || true)"
            if [ "$code" != "200" ]; then
              echo "Request $path returned HTTP $code" >&2
              cat /tmp/pixcape-response.txt >&2 || true
              docker logs pixcape-smoke >&2 || true
              exit 1
            fi
            if [ -n "$expected" ] && ! grep -qi "$expected" /tmp/pixcape-response.txt; then
              echo "Request $path did not contain expected marker: $expected" >&2
              head -c 2000 /tmp/pixcape-response.txt >&2 || true
              exit 1
            fi
          }
          check_http / '<html'
          check_http /login '<html'
          check_http /studio/ '<html'
          check_http /blockbench/ '<html'
          check_http /api/ai/models
          docker exec pixcape-smoke sh -c 'test -s /opt/pixcape-next/generated/prisma-postgresql/index.js'
          echo "PostgreSQL-only Docker image passed runtime smoke tests."

  publish:
    if: github.event_name != 'pull_request'
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
      - name: Build and publish PostgreSQL-only image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runtime-postgresql
          cache-to: type=gha,mode=max,scope=runtime-postgresql

  deploy-1panel:
    name: Deploy to 1Panel V2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CDPC_DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Copy Compose definition and deployment script to 1Panel project
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CDPC_DEPLOY_HOST }}
          username: ${{ secrets.CDPC_DEPLOY_USER }}
          key: ${{ secrets.CDPC_DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.CDPC_DEPLOY_FINGERPRINT }}
          port: ${{ secrets.CDPC_DEPLOY_PORT || '22' }}
          source: "docker-compose.yml,deploy-1panel.sh"
          target: ${{ secrets.CDPC_DEPLOY_PATH }}
      - name: Deploy exact commit image and verify container health
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.CDPC_DEPLOY_PATH }}
          COMMIT_SHA: ${{ github.sha }}
          CDPC_GHCR_USERNAME: ${{ secrets.CDPC_GHCR_USERNAME }}
          CDPC_GHCR_TOKEN: ${{ secrets.CDPC_GHCR_TOKEN }}
        with:
          host: ${{ secrets.CDPC_DEPLOY_HOST }}
          username: ${{ secrets.CDPC_DEPLOY_USER }}
          key: ${{ secrets.CDPC_DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.CDPC_DEPLOY_FINGERPRINT }}
          port: ${{ secrets.CDPC_DEPLOY_PORT || '22' }}
          envs: DEPLOY_PATH,COMMIT_SHA,CDPC_GHCR_USERNAME,CDPC_GHCR_TOKEN
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            chmod 700 deploy-1panel.sh
            ./deploy-1panel.sh "$COMMIT_SHA"
