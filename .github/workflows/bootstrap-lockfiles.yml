name: Bootstrap npm lockfiles

on:
  push:
    branches:
      - feat/reproducible-deps-auth-e2e
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'ai-api/package.json'
      - '.github/workflows/bootstrap-lockfiles.yml'

permissions:
  contents: write

concurrency:
  group: bootstrap-lockfiles-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-lockfiles:
    if: ${{ github.ref == 'refs/heads/feat/reproducible-deps-auth-e2e' || github.event.pull_request.head.ref == 'feat/reproducible-deps-auth-e2e' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate root npm lockfile without running lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Generate AI API npm lockfile without running lifecycle scripts
        run: npm --prefix ai-api install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfiles if they changed
        shell: bash
        run: |
          set -euo pipefail
          TARGET_BRANCH="${{ github.event.pull_request.head.ref || github.ref_name }}"
          git pull --rebase origin "$TARGET_BRANCH"
          git add package-lock.json ai-api/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: add npm lockfiles for reproducible installs"
          git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
